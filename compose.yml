services:
  openchamber:
    build:
      context: .
      dockerfile: Dockerfile.openchamber
      args:
        OPENCHAMBER_REF: ${OPENCHAMBER_REF:-main}
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    container_name: openchamber
    restart: unless-stopped
    # ポートは nginx → oauth2-proxy 経由でしかアクセスしないためホストには公開しない
    expose:
      - "3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OPENCHAMBER_HOST: 0.0.0.0
      UI_PASSWORD: ${UI_PASSWORD:?set UI_PASSWORD in .env}
      OPENCHAMBER_OPENCODE_HOSTNAME: 0.0.0.0
      OPENCODE_BINARY: /home/openchamber/.npm-global/bin/opencode
      PATH: /home/openchamber/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # Uncomment these if OpenChamber should connect to an external OpenCode server.
      # OPENCODE_HOST: ${OPENCODE_HOST}
      # OPENCODE_SKIP_START: "true"
    volumes:
      - ./data/openchamber:/home/openchamber/.config/openchamber
      - ./data/opencode/share:/home/openchamber/.local/share/opencode
      - ./data/opencode/state:/home/openchamber/.local/state/opencode
      - ./data/opencode/config:/home/openchamber/.config/opencode
      - ./data/ssh:/home/openchamber/.ssh
      - ./data/gh:/home/openchamber/.config/gh
      - ./workspaces:/home/openchamber/workspaces
      - ./data/google-workspace-mcp:/home/openchamber/.google_workspace_mcp
      - ${VAULT_PATH:?set VAULT_PATH in .env}:/home/openchamber/workspaces/obsidian-vault
      - ./romira-s-config/ai-config/skills:/home/openchamber/.config/opencode/skills:ro
      - ./romira-s-config/ai-config/rules:/home/openchamber/.config/opencode/rules:ro
      - ./romira-s-config/ai-config/CLAUDE.md:/home/openchamber/.config/opencode/AGENTS.md:ro
      - ./romira-s-config/ai-config/opencode/opencode.json:/home/openchamber/.config/opencode/opencode.json:ro
      - ./romira-s-config/ai-config/opencode/tui.json:/home/openchamber/.config/opencode/tui.json:ro
      - ./romira-s-config/ai-config/opencode/prompts:/home/openchamber/.config/opencode/prompts:ro

  livesync-cli:
    build:
      context: .
      dockerfile: Dockerfile.livesync-cli
    container_name: livesync-cli
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -s /vault/.livesync/settings.json ] || ! grep -q '"isConfigured"[[:space:]]*:[[:space:]]*true' /vault/.livesync/settings.json; then
          echo "LiveSync CLI is not configured yet. Run setup before enabling sync.";
          sleep infinity;
        fi
        exec node /app/dist/index.cjs /vault
    volumes:
      - ${VAULT_PATH:?set VAULT_PATH in .env}:/vault

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.2
    container_name: oauth2-proxy
    restart: unless-stopped
    depends_on:
      - openchamber
    command:
      - --provider=google
      - --client-id=${OAUTH2_PROXY_CLIENT_ID:?set OAUTH2_PROXY_CLIENT_ID in .env}
      - --client-secret=${OAUTH2_PROXY_CLIENT_SECRET:?set OAUTH2_PROXY_CLIENT_SECRET in .env}
      - --cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET:?set OAUTH2_PROXY_COOKIE_SECRET in .env}
      - --cookie-secure=${OAUTH2_PROXY_COOKIE_SECURE:-true}
      - --redirect-url=${OAUTH2_PROXY_REDIRECT_URL:?set OAUTH2_PROXY_REDIRECT_URL in .env}
      - --upstream=http://openchamber:3000
      - --http-address=0.0.0.0:4180
      - --authenticated-emails-file=/etc/oauth2-proxy/authenticated-emails.txt
      - --cookie-expire=168h
      - --reverse-proxy=true
      - --pass-host-header=true
      - --proxy-websockets=true
    volumes:
      - ./authenticated-emails.txt:/etc/oauth2-proxy/authenticated-emails.txt:ro
    ports:
      - "${OAUTH2_PROXY_PORT:-4180}:4180"
